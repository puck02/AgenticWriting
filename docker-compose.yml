services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.1ms.run/library/postgres:16-alpine}
    environment:
      POSTGRES_DB: agentic_writing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentic_writing"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
